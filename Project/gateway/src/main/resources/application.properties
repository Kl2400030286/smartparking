spring.application.name=parkgrid-gateway
spring.cloud.gateway.routes[0].id=booking-api
spring.cloud.gateway.routes[0].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/bookings/**
spring.cloud.gateway.routes[1].id=billing-api
spring.cloud.gateway.routes[1].uri=lb://BILLING-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/billing/**
spring.cloud.gateway.routes[2].id=parking-auth-api
spring.cloud.gateway.routes[2].uri=lb://PARKING-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[3].id=parking-api
spring.cloud.gateway.routes[3].uri=lb://PARKING-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/parking/**
spring.cloud.gateway.routes[4].id=parking-admin-api
spring.cloud.gateway.routes[4].uri=lb://PARKING-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/admin/**
spring.cloud.gateway.routes[5].id=parking-health-api
spring.cloud.gateway.routes[5].uri=lb://PARKING-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/actuator/health
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
server.port=8081
management.endpoints.web.exposure.include=health,info,gateway
