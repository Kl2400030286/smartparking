spring.application.name=booking-service
server.port=${SERVER_PORT:8082}
parkgrid.parking-url=${PARKING_URL:http://localhost:8080}
parkgrid.billing-url=${BILLING_URL:http://localhost:8083}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=${EUREKA_REGISTER:true}
eureka.client.fetch-registry=${EUREKA_FETCH:true}
management.endpoints.web.exposure.include=health,info
