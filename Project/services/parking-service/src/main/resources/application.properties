spring.application.name=parking-service
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/parkingslot?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.port=${SERVER_PORT:8080}
parkgrid.jwt-secret=${JWT_SECRET}
parkgrid.jwt-expiration-minutes=${JWT_EXPIRATION_MINUTES:30}
parkgrid.admin-bootstrap-enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
parkgrid.admin-bootstrap-email=${ADMIN_BOOTSTRAP_EMAIL:}
parkgrid.admin-bootstrap-password=${ADMIN_BOOTSTRAP_PASSWORD:}
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.register-with-eureka=${EUREKA_REGISTER:true}
eureka.client.fetch-registry=${EUREKA_FETCH:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
management.endpoints.web.exposure.include=health,info
parkgrid.billing-url=${BILLING_URL:http://localhost:8080}
parkgrid.booking-completion-delay-ms=${BOOKING_COMPLETION_DELAY_MS:60000}
